<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Hello Deployment</title>
  </head>
  <body>
    <h1>Hello Deployment</h1>

    <label for="prompt">Prompt for Gemini</label>
    <br>
    <textarea id="prompt" rows="4" cols="50" maxlength="1000"
      placeholder="Ask Gemini something..."></textarea>
    <br>
    <button id="send-prompt">Send prompt</button>
    <p id="response">Enter a prompt and click Send prompt.</p>

    <script>
      document.querySelector("#send-prompt").addEventListener("click", async () => {
        const promptElement = document.querySelector("#prompt");
        const responseElement = document.querySelector("#response");
        const button = document.querySelector("#send-prompt");
        const prompt = promptElement.value.trim();

        if (!prompt) {
          responseElement.textContent = "Enter a prompt first.";
          return;
        }

        button.disabled = true;
        responseElement.textContent = "Waiting for Gemini...";

        try {
          const response = await fetch("/api/generate", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ prompt }),
          });

          const data = await response.json();
          if (!response.ok) {
            throw new Error(data.detail || `HTTP ${response.status}`);
          }

          responseElement.textContent = data.response;
        } catch (error) {
          responseElement.textContent = `Request failed: ${error.message}`;
        } finally {
          button.disabled = false;
        }
      });
    </script>
  </body>
</html>
